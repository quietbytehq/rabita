<!-- System bus policy: only root may own the name; any user may call it.
     Privileged methods are additionally gated by polkit. -->
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.quietbyte.Rabita1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.quietbyte.Rabita1"/>
    <allow receive_sender="org.quietbyte.Rabita1"/>
  </policy>
</busconfig>
