# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    name: Format, clippy, licence headers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: SPDX headers
        run: scripts/check-spdx.sh

  build-test:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --workspace --all-targets --locked
      - name: test
        run: cargo test --workspace --locked
      - name: smoke-run binaries
        run: |
          ./target/debug/rabita-helper --help
          ./target/debug/rabitactl --help
          ./target/debug/rabita-agent
          ./target/debug/rabita-app
      - name: D-Bus smoke test (private session bus)
        run: |
          sudo apt-get install -y -q dbus
          scripts/dbus-smoke.sh target/debug

  # Confirms the workspace still builds on the oldest Rust we promise to support.
  msrv:
    name: Minimum supported Rust (1.89)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
